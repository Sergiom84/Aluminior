name: Validación completa
on:
  push:
    branches: [main, 'codex/**']
  pull_request:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: validacion-${{ github.ref }}
  cancel-in-progress: true
jobs:
  calidad:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NEXT_TELEMETRY_DISABLED: '1'
      DATABASE_URL: postgres://aluminior:aluminior@localhost:55433/aluminior_test
      ALUMINIOR_QA_AUTH_BYPASS: '0'
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: aluminior
          POSTGRES_PASSWORD: aluminior
          POSTGRES_DB: aluminior_test
        ports: ['55433:5432']
        options: >-
          --health-cmd "pg_isready -U aluminior -d aluminior_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
      - run: npm install --global npm@10.9.8
      - run: npm ci
      # Mismo arranque que Docker local: auth.users y BD ETL separada.
      # No fijar TEST_DATABASE_URL: las suites destructivas tienen destinos propios.
      - name: Preparar PostgreSQL sintético
        run: docker exec -i "${{ job.services.postgres.id }}" psql -U aluminior -d aluminior_test -v ON_ERROR_STOP=1 < packages/db/test-auth-bootstrap.sql
      - name: Suite de los cuatro paquetes
        run: npm run test:ci
      - name: Fronteras de arquitectura
        run: npm run check:architecture
      - name: Compilación de producción
        run: npm run -w @aluminior/web build
      - name: Tipos de los cuatro paquetes y del navegador
        run: |
          npm run typecheck
          npm run typecheck:e2e
